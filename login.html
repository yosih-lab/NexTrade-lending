<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>NexTrade — כניסה</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:Heebo,sans-serif;
      background:#04060c;
      color:#fff;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      direction:rtl;
    }
    .card{
      background:#0a0d16;
      border:1px solid #1e2637;
      border-radius:16px;
      padding:2.5rem 2rem;
      width:100%;
      max-width:400px;
      box-shadow:0 8px 40px rgba(0,0,0,.6);
    }
    .logo{
      text-align:center;
      font-size:1.6rem;
      font-weight:900;
      color:#2962ff;
      letter-spacing:2px;
      margin-bottom:.2rem;
    }
    .subtitle{
      text-align:center;
      font-size:.78rem;
      color:#8899aa;
      margin-bottom:2rem;
    }
    .tabs{
      display:flex;
      gap:0;
      border-radius:8px;
      overflow:hidden;
      border:1px solid #1e2637;
      margin-bottom:1.6rem;
    }
    .tab{
      flex:1;
      padding:.55rem;
      text-align:center;
      cursor:pointer;
      font-size:.85rem;
      color:#8899aa;
      background:#0f1420;
      border:none;
      transition:all .2s;
    }
    .tab.active{background:#2962ff;color:#fff;font-weight:700;}
    .form-group{margin-bottom:1rem;}
    label{display:block;font-size:.78rem;color:#8899aa;margin-bottom:.35rem;}
    input{
      width:100%;
      background:#0f1420;
      border:1px solid #1e2637;
      border-radius:8px;
      color:#fff;
      padding:.65rem .9rem;
      font-size:.9rem;
      font-family:Heebo,sans-serif;
      outline:none;
      transition:border-color .2s;
    }
    input:focus{border-color:#2962ff;}
    .pw-wrap{position:relative;}
    .pw-wrap input{padding-left:2.4rem;}
    .pw-eye{
      position:absolute;left:.7rem;top:50%;transform:translateY(-50%);
      background:none;border:none;color:#8899aa;cursor:pointer;
      font-size:1rem;padding:0;line-height:1;
    }
    .pw-eye:hover{color:#fff;}
    .btn-primary{
      width:100%;
      padding:.75rem;
      background:#2962ff;
      border:none;
      border-radius:8px;
      color:#fff;
      font-size:1rem;
      font-weight:700;
      font-family:Heebo,sans-serif;
      cursor:pointer;
      margin-top:.5rem;
      transition:background .2s;
    }
    .btn-primary:hover{background:#1a4fd6;}
    .msg{
      margin-top:1rem;
      padding:.5rem .8rem;
      border-radius:8px;
      font-size:.82rem;
      text-align:center;
      display:none;
    }
    .msg.ok{background:rgba(38,166,154,.15);border:1px solid #26a69a;color:#26a69a;display:block;}
    .msg.err{background:rgba(239,83,80,.12);border:1px solid #ef5350;color:#ef5350;display:block;}
    .server-note{
      margin-top:1.2rem;
      font-size:.72rem;
      color:#8899aa;
      text-align:center;
      padding:.4rem;
      background:#0f1420;
      border-radius:6px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">NexTrade</div>
  <div class="subtitle">פלטפורמת מסחר מקצועית</div>

  <div class="tabs">
    <button class="tab active" id="tabLogin" onclick="switchTab('login')">כניסה</button>
    <button class="tab" id="tabReg" onclick="switchTab('register')">הרשמה</button>
  </div>

  <!-- Login -->
  <div id="formLogin">
    <div class="form-group">
      <label>שם משתמש / אימייל</label>
      <input id="lUsername" type="text" placeholder="הכנס שם משתמש" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <div class="pw-wrap">
        <input id="lPassword" type="password" placeholder="הכנס סיסמה" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button type="button" class="pw-eye" onclick="togglePw('lPassword',this)" title="הצג/הסתר סיסמה">👁</button>
      </div>
    </div>
    <button class="btn-primary" onclick="doLogin()">כניסה</button>
  </div>

  <!-- Register -->
  <div id="formRegister" style="display:none">
    <div class="form-group">
      <label>שם משתמש</label>
      <input id="rUsername" type="text" placeholder="בחר שם משתמש" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>אימייל</label>
      <input id="rEmail" type="email" placeholder="כתובת אימייל" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <div class="pw-wrap">
        <input id="rPassword" type="password" placeholder="לפחות 6 תווים" autocomplete="new-password" onkeydown="if(event.key==='Enter')doRegister()"/>
        <button type="button" class="pw-eye" onclick="togglePw('rPassword',this)" title="הצג/הסתר סיסמה">👁</button>
      </div>
    </div>
    <button class="btn-primary" onclick="doRegister()">הרשמה</button>
  </div>

  <div id="msg" class="msg"></div>

  <div id="serverNote" style="margin-top:1rem;font-size:.72rem;color:#8899aa;padding:.5rem .7rem;background:#0f1420;border-radius:6px;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap">
    <span id="serverDot" style="font-size:10px">⏳</span>
    <span id="serverNoteText">בודק חיבור לשרת...</span>
    <span style="flex:1"></span>
    <input id="apiBaseInput" placeholder="כתובת שרת" style="background:#04060c;border:1px solid #1e2637;border-radius:4px;color:#fff;padding:.2rem .5rem;font-size:.72rem;font-family:Heebo,sans-serif;width:180px;outline:none"/>
    <button onclick="saveApiBase()" style="background:#1e2637;border:none;border-radius:4px;color:#fff;padding:.2rem .5rem;font-size:.72rem;cursor:pointer;font-family:Heebo,sans-serif">שמור</button>
  </div>
</div>

<script>
  var API_BASE = localStorage.getItem('nt_api_base') || 'https://nextrade-lending.onrender.com';

  function switchTab(t) {
    document.getElementById('formLogin').style.display    = t==='login'    ? '' : 'none';
    document.getElementById('formRegister').style.display = t==='register' ? '' : 'none';
    document.getElementById('tabLogin').classList.toggle('active', t==='login');
    document.getElementById('tabReg').classList.toggle('active', t==='register');
    setMsg('','');
  }

  function setMsg(text, type) {
    var el = document.getElementById('msg');
    el.textContent = text;
    el.className = 'msg ' + (type || '');
    if (!type) el.style.display = 'none';
  }

  async function doLogin() {
    var u = document.getElementById('lUsername').value.trim();
    var p = document.getElementById('lPassword').value;
    if (!u || !p) { setMsg('נא למלא את כל השדות', 'err'); return; }
    try {
      var r = await fetch(API_BASE + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      var data = await r.json();
      if (!r.ok) { setMsg(data.error || 'שגיאה', 'err'); return; }
      localStorage.setItem('nt_token', data.token);
      localStorage.setItem('nt_user', JSON.stringify({ username: data.username, role: data.role }));
      setMsg('✅ ברוך הבא ' + data.username + '! מעביר...', 'ok');
      setTimeout(function() { window.location.href = 'index.html'; }, 1000);
    } catch(e) {
      setMsg('❌ לא ניתן להתחבר לשרת: ' + e.message, 'err');
    }
  }

  async function doRegister() {
    var u = document.getElementById('rUsername').value.trim();
    var e = document.getElementById('rEmail').value.trim().toLowerCase();
    var p = document.getElementById('rPassword').value;
    if (!u || !e || !p) { setMsg('נא למלא את כל השדות', 'err'); return; }
    try {
      var r = await fetch(API_BASE + '/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, email: e, password: p })
      });
      var data = await r.json();
      if (!r.ok) { setMsg(data.error || 'שגיאה', 'err'); return; }
      setMsg('✅ ' + (data.message || 'נרשמת בהצלחה! כנס עכשיו.'), 'ok');
      switchTab('login');
      document.getElementById('lUsername').value = u;
    } catch(e2) {
      setMsg('❌ לא ניתן להתחבר לשרת: ' + e2.message, 'err');
    }
  }

  function togglePw(id, btn) {
    var inp = document.getElementById(id);
    if (!inp) return;
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  }

  // Server connectivity check — with 20s timeout (Render wakes up slowly)
  document.getElementById('apiBaseInput').value = API_BASE;
  var _checkServerTimer = null;
  async function checkServer() {
    var dot  = document.getElementById('serverDot');
    var note = document.getElementById('serverNoteText');
    dot.textContent  = '⏳';
    note.textContent = 'בודק חיבור לשרת... (עד 30 שניות)';
    note.style.color = '#8899aa';
    // Render free tier can take 30s to wake up
    var controller = new AbortController();
    var timeout = setTimeout(function() { controller.abort(); }, 30000);
    try {
      var r = await fetch(API_BASE + '/', { cache: 'no-store', signal: controller.signal });
      clearTimeout(timeout);
      if (r.ok) {
        dot.textContent  = '🟢';
        note.textContent = 'שרת מחובר ✓';
        note.style.color = '#26a69a';
      } else { throw new Error('status ' + r.status); }
    } catch(e) {
      clearTimeout(timeout);
      if (e.name === 'AbortError') {
        dot.textContent  = '🟡';
        note.textContent = 'השרת מתעורר... נסה שוב בעוד רגע';
        note.style.color = '#f5a623';
      } else {
        dot.textContent  = '🔴';
        note.textContent = 'שרת לא נגיש — בדוק את הכתובת';
        note.style.color = '#ef5350';
      }
    }
  }
  checkServer();

  function saveApiBase() {
    var val = (document.getElementById('apiBaseInput').value || '').trim().replace(/\/$/, '');
    if (!val) return;
    localStorage.setItem('nt_api_base', val);
    API_BASE = val;
    checkServer();
  }

  // If already logged in AND token is still valid, go straight to app
  (async function() {
    var token = localStorage.getItem('nt_token');
    if (!token) return;
    try {
      var r = await fetch(API_BASE + '/api/me', { headers: { 'Authorization': 'Bearer ' + token } });
      if (r.ok) { window.location.href = 'index.html'; }
      else {
        // Token expired or invalid — clear it so user can login again
        localStorage.removeItem('nt_token');
        localStorage.removeItem('nt_user');
      }
    } catch(e) {
      // Server unreachable — keep token, don't redirect
    }
  })();
</script>
</body>
</html>
